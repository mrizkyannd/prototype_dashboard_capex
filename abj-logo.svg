    </defs>

    <!-- Subtitle Air Bersih Jakarta -->
    <text x="150" y="172" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="25" fill="#0b3899" letter-spacing="-0.3">Air Bersih Jakarta</text>
